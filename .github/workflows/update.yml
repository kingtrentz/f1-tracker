# F1 Tracker: pulls F1 data, builds the pages, publishes to GitHub Pages.
# Wakes every 10 minutes. On race weekends it updates every time; otherwise about once an hour.
# Free on public repos. No API keys or personal tokens needed. Push alerts use the VAPID_PRIVATE_KEY secret (optional).
name: Update F1 tracker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:        # "Run workflow" button on the Actions tab forces an update
  push:
    branches: [main]

permissions:
  contents: write           # weekly keep-alive commit (GitHub pauses schedules after 60 quiet days)
  pages: write
  id-token: write

concurrency:
  group: f1-tracker
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - name: Is an update due?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "Manual or push run: updating"; else python3 build.py --gate; fi
      - name: Weekly keep-alive commit
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 604800 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
            git config user.name "f1-tracker-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add heartbeat.txt
            git commit -m "Keep-alive (stops GitHub pausing the schedule)"
            git push
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.build.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Install push alert library
        run: pip install --quiet --disable-pip-version-check pywebpush==2.5.0 || echo "pywebpush not installed, alerts will be skipped"

      - name: Pull data and build pages
        id: build
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PYTHONUNBUFFERED: "1"   # print progress as it happens, so a slow run shows where it got stuck
        run: python3 build.py

      - name: Save new history seasons, ghost laps, news, suggestions and alert state to the repo
        if: steps.build.outputs.publish == 'true'
        run: |
          if [ -n "$(git status --porcelain history ghost news ideas.md push)" ]; then
            git config user.name "f1-tracker-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history ghost news ideas.md
            if [ -d push ]; then git add push; fi
            git commit -m "Save new history seasons / ghost laps / news / suggestions / alerts"
            git push || echo "push failed, will retry next run"
          fi

      - uses: actions/upload-pages-artifact@v5
        if: steps.build.outputs.publish == 'true'
        with:
          path: _site

  # Publishing is its own job. GitHub's artifact list can lag a moment behind the upload, and
  # deploy-pages looked it up within half a second and found nothing ("No artifacts named github-pages").
  # The job hand-off adds a natural delay, and one retry after a pause covers the rest.
  deploy:
    needs: update
    if: needs.update.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying the publish
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Publish to GitHub Pages (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

  healthcheck:
    needs: [update, deploy]
    if: always() && needs.update.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping healthchecks.io (optional)
        env:
          HC: ${{ secrets.HEALTHCHECK_URL }}
          UPDATE: ${{ needs.update.result }}
          DEPLOY: ${{ needs.deploy.result }}
          PUBLISH: ${{ needs.update.outputs.publish }}
        run: |
          [ -z "$HC" ] && exit 0
          if [ "$UPDATE" = "success" ] && [ "$PUBLISH" != "true" ]; then exit 0; fi   # skipped publish, next run retries
          if [ "$UPDATE" = "success" ] && [ "$DEPLOY" = "success" ]; then curl -fsS -m 10 "$HC" >/dev/null || true; else curl -fsS -m 10 "$HC/fail" >/dev/null || true; fi
